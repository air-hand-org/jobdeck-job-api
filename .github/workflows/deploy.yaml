name: Deploy

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    if: ${{ github.event.release.prerelease == false }}
    uses: $/.github/workflows/_build-images.yaml
    with:
      push: true
      image-tag: ${{ github.event.release.tag_name }}
      environment: production
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  schema-build:
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: air-hand-org/jobdeck-actions/actions/setup-tools@1d9ce1953c373273f28cac191bcf5ff0fc58100d # v1.7.0
      - run: make schema-erd
      - uses: actions/upload-pages-artifact@5f327015a708106f6f1b7c9a633901af30fe80cb
        with:
          path: tmp/schema-erd

  schema-pages:
    needs: schema-build
    runs-on: ubuntu-latest
    concurrency:
      group: schema-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  release-dispatch:
    if: ${{ github.event.release.prerelease == false }}
    needs: images
    uses: air-hand-org/jobdeck-actions/.github/workflows/reusable-release-dispatch.yaml@1d9ce1953c373273f28cac191bcf5ff0fc58100d # v1.7.0
    with:
      service-names: job-api
    secrets: inherit
