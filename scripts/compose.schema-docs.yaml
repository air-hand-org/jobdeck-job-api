services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: schema_docs
      POSTGRES_PASSWORD: schema_docs
      POSTGRES_DB: jobdeck_job
      LANG: C
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U schema_docs -d jobdeck_job"]
      interval: 1s
      timeout: 5s
      retries: 60
